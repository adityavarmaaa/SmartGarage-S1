[project]
name = "smart-parking-s1"
version = "0.1.0"
description = "SmartGarage Vehicle Intelligence and Parking Management services."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
norecursedirs = [
    "scripts",
    "IMG2138*",
    "backup_before_lifecycle_determinism",
    "identity_handoff_backup",
    "final_run_backup",
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "{arch}",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vehicle_intelligence", "vehicle_intelligence.*", "parking_management", "parking_management.app*"]

[tool.setuptools.package-data]
parking_management = ["migrations/*.sql", "requirements.txt"]
